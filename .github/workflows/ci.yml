name: admin-web-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: admin-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          git diff --exit-code

      - name: Browser secret boundary
        run: npm run security:check

      - name: Delivery contract
        run: npm run delivery:check

      - name: Workflow supply-chain policy
        run: npm run workflow:check

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci_publishable_placeholder
          NEXT_PUBLIC_ADMIN_API_URL: https://admin-api.ci-placeholder.test
        run: npm run build
