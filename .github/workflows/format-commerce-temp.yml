name: format-commerce-temp

on:
  pull_request:
    paths:
      - "app/commerce/**"
      - "tests/commerce-*.test.ts"
      - ".github/workflows/format-commerce-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          show-progress: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Format commerce sources
        run: npm run format
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/commerce tests/commerce-catalog-control-contract.test.ts tests/commerce-promotions-contract.test.ts tests/commerce-reference-pages-contract.test.ts
          git rm .github/workflows/format-commerce-temp.yml
          git commit -m "chore(commerce): apply repo formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
