name: tmp-adm-plat-002-lint-fix

on:
  pull_request:
    paths:
      - 'src/components/shell/GlobalCommandPalette.tsx'
      - '.github/workflows/tmp-adm-plat-002-lint-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Fix effect lint and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/shell/GlobalCommandPalette.tsx')
          text = path.read_text()

          old_recents = '''  useEffect(() => {\n    if (!open) return;\n    try {\n      const raw = window.localStorage.getItem(RECENTS_KEY);\n      setRecents(safeRecent(raw ? JSON.parse(raw) : [], commands));\n    } catch {\n      setRecents([]);\n    }\n  }, [commands, open]);'''
          new_recents = '''  useEffect(() => {\n    if (!open) return;\n    const frame = requestAnimationFrame(() => {\n      try {\n        const raw = window.localStorage.getItem(RECENTS_KEY);\n        setRecents(safeRecent(raw ? JSON.parse(raw) : [], commands));\n      } catch {\n        setRecents([]);\n      }\n    });\n    return () => cancelAnimationFrame(frame);\n  }, [commands, open]);'''
          if old_recents not in text:
              raise SystemExit('recent-history effect anchor missing')
          text = text.replace(old_recents, new_recents, 1)

          old_idle = '''  useEffect(() => {\n    if (!open || query.trim().length < 3 || !searchable) {\n      setState({ kind: "idle" });\n      return;\n    }'''
          new_idle = '''  useEffect(() => {\n    if (!open || query.trim().length < 3 || !searchable) return;'''
          if old_idle not in text:
              raise SystemExit('search effect idle anchor missing')
          text = text.replace(old_idle, new_idle, 1)
          path.write_text(text)
          PY
          npm install --no-audit --no-fund
          npm run format
          git rm -f .github/workflows/tmp-adm-plat-002-lint-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/shell/GlobalCommandPalette.tsx
          git commit -m 'fix(admin): avoid synchronous state updates in palette effects'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
