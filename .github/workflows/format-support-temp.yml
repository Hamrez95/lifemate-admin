name: format-support-temp

on:
  pull_request:
    paths:
      - "app/support/**"
      - "tests/support-reference-pages-contract.test.ts"
      - ".github/workflows/format-support-temp.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Format support sources
        run: npm run format
      - name: Commit formatting and remove helper
        run: |
          git rm .github/workflows/format-support-temp.yml
          git add app/support tests/support-reference-pages-contract.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(support): apply repo formatting"
          git push origin HEAD:${{ github.head_ref }}
