name: security-design-apply
on:
  push:
    branches: [feat/security-privacy-rbac-audit-18-20]
    paths: [.github/workflows/security-design-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/security-privacy-rbac-audit-18-20
      - name: Apply reference 18-20 presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block missing: {path}")
              p.write_text(text.replace(old, new, 1))

          security = 'app/security/page.tsx'
          replace(security,
            'import Link from "next/link";\nimport { redirect } from "next/navigation";',
            'import Image from "next/image";\nimport Link from "next/link";\nimport { redirect } from "next/navigation";')
          replace(security,
            '''          <section className={styles.hero} aria-labelledby="rbac-title">\n            <div>\n              <p className="eyebrow">ADM-SEC-001 · READ ONLY</p>\n              <h2 id="rbac-title">ماتریس نقش و مجوز</h2>\n              <p>\n                نمای canonical از نقش‌ها، permissionهای قابل‌اعطا و مرز دسترسی‌های ویژه. این صفحه\n                assignment را تغییر نمی‌دهد و هیچ دسترسی سلامت ویژه‌ای را به نقش معمولی تبدیل\n                نمی‌کند.\n              </p>\n            </div>\n            <div className={styles.sourceCard} aria-label="منبع و تازگی RBAC">''',
            '''          <section className={styles.hero} aria-labelledby="rbac-title">\n            <div className={styles.heroCopy}>\n              <p className="eyebrow">SECURITY / PRIVACY · ADM-SEC-001</p>\n              <h2 id="rbac-title">امنیت، حریم خصوصی و نقش‌ها</h2>\n              <p>\n                نمای canonical از Role × Permission و مرزهای دسترسی حساس. default-deny، AAL2 و\n                Break-glass خارج از این UI enforce می‌شوند و این صفحه هیچ permission فرضی نمی‌سازد.\n              </p>\n              <nav className={styles.securityNav} aria-label="بخش‌های امنیت">\n                <Link href="/security" aria-current="page">Roles & Permissions</Link>\n                <Link href="/security/audit">Audit Log</Link>\n              </nav>\n            </div>\n            <Image\n              className={styles.heroImage}\n              src="/design-assets/security-audit-hero-v1.png"\n              alt="تصویر مفهومی امنیت و ممیزی LifeMate"\n              width={1536}\n              height={1024}\n              sizes="(max-width: 820px) 180px, 220px"\n              priority\n            />\n            <div className={styles.sourceCard} aria-label="منبع و تازگی RBAC">''')

          audit = 'app/security/audit/page.tsx'
          replace(audit,
            'import Link from "next/link";\nimport { redirect } from "next/navigation";',
            'import Image from "next/image";\nimport Link from "next/link";\nimport { redirect } from "next/navigation";')
          replace(audit,
            '''          <section className={styles.hero} aria-labelledby="audit-title">\n            <div>\n              <p className="eyebrow">ADM-SEC-003 · READ ONLY</p>\n              <h2 id="audit-title">Audit Log Explorer</h2>\n              <p>\n                رویدادهای ثبت‌شده در منبع canonical را بدون دسترسی مستقیم مرورگر به دیتابیس نمایش\n                می‌دهد. payload خام، metadata محرمانه و secret در این نما نمایش داده نمی‌شود.\n              </p>\n            </div>\n            <div className={styles.heroActions}>''',
            '''          <section className={styles.hero} aria-labelledby="audit-title">\n            <div className={styles.heroCopy}>\n              <p className="eyebrow">AUDIT · ADM-SEC-003 · READ ONLY</p>\n              <h2 id="audit-title">Audit Log Explorer</h2>\n              <p>\n                رویدادهای immutable و محدودشده‌ی قرارداد canonical؛ بدون payload خام، metadata\n                محرمانه، secret یا دسترسی مستقیم مرورگر به دیتابیس.\n              </p>\n            </div>\n            <Image\n              className={styles.heroImage}\n              src="/design-assets/security-audit-hero-v1.png"\n              alt="تصویر مفهومی امنیت و ممیزی LifeMate"\n              width={1536}\n              height={1024}\n              sizes="(max-width: 760px) 160px, 200px"\n            />\n            <div className={styles.heroActions}>''')

          role = 'app/security/roles/[roleCode]/page.tsx'
          replace(role,
            'import Link from "next/link";\nimport { notFound, redirect } from "next/navigation";',
            'import Image from "next/image";\nimport Link from "next/link";\nimport { notFound, redirect } from "next/navigation";')
          replace(role,
            '''          <section className={styles.hero} aria-labelledby="role-detail-title">\n            <div>\n              <p className="eyebrow">ADM-SEC-002 · READ ONLY</p>''',
            '''          <section className={styles.hero} aria-labelledby="role-detail-title">\n            <div className={styles.heroCopy}>\n              <p className="eyebrow">ROLES / PERMISSIONS · ADM-SEC-002</p>''')
          replace(role,
            '''            </div>\n            <div className={styles.sourceCard} aria-label="منبع و تازگی جزئیات نقش">''',
            '''            </div>\n            <Image\n              className={styles.heroImage}\n              src="/design-assets/security-audit-hero-v1.png"\n              alt="تصویر مفهومی کنترل دسترسی LifeMate"\n              width={1536}\n              height={1024}\n              sizes="(max-width: 760px) 150px, 190px"\n            />\n            <div className={styles.sourceCard} aria-label="منبع و تازگی جزئیات نقش">''')

          Path('app/security/security.module.css').write_text(Path('app/security/security.module.css').read_text() + '''\n\n.heroCopy { min-width: 0; flex: 1 1 420px; }\n.heroImage { width: 220px; height: auto; max-height: 150px; object-fit: contain; flex: 0 0 auto; }\n.securityNav { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; }\n.securityNav a { min-height: 40px; display: inline-flex; align-items: center; padding: .35rem .75rem; border: 1px solid #cfe3d8; border-radius: 999px; background: #f3faf6; color: #285f4b; text-decoration: none; font-weight: 800; }\n@media (max-width: 820px) { .heroImage { width: 180px; align-self: center; } }\n''')
          Path('app/security/audit/audit.module.css').write_text(Path('app/security/audit/audit.module.css').read_text() + '''\n\n.heroCopy { min-width: 0; flex: 1 1 420px; }\n.heroImage { width: 200px; height: auto; max-height: 140px; object-fit: contain; flex: 0 0 auto; }\n@media (max-width: 760px) { .heroImage { width: 160px; align-self: center; } }\n''')
          Path('app/security/roles/[roleCode]/role-detail.module.css').write_text(Path('app/security/roles/[roleCode]/role-detail.module.css').read_text() + '''\n\n.heroCopy { min-width: 0; flex: 1 1 420px; }\n.heroImage { width: 190px; height: auto; max-height: 130px; object-fit: contain; flex: 0 0 auto; }\n@media (max-width: 760px) { .heroImage { width: 150px; align-self: center; } }\n''')
          PY
          npx prettier --write app/security/page.tsx app/security/security.module.css app/security/audit/page.tsx app/security/audit/audit.module.css 'app/security/roles/[roleCode]/page.tsx' 'app/security/roles/[roleCode]/role-detail.module.css' 'app/security/roles/[roleCode]/StaffMembershipControls.tsx'
          git rm .github/workflows/security-design-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/security
          git commit -m "feat(security): align privacy roles and audit references"
          git push origin HEAD:feat/security-privacy-rbac-audit-18-20
