name: tmp-adm-plat-003-verify

on:
  pull_request:
    paths:
      - 'app/api/admin/notifications/**'
      - 'src/components/shell/NotificationCenter.tsx'
      - 'src/components/shell/notification-center.module.css'
      - 'src/components/shell/Topbar.tsx'
      - 'src/lib/admin-api/notifications.ts'
      - 'tests/notification-center-contract.test.ts'
      - '.github/workflows/tmp-adm-plat-003-verify.yml'

permissions:
  contents: write

jobs:
  verify-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Format and verify notification center
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci_publishable_placeholder
          NEXT_PUBLIC_ADMIN_API_URL: https://admin-api.ci-placeholder.test
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run format
          npm run security:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git rm -f .github/workflows/tmp-adm-plat-003-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/admin/notifications src/components/shell src/lib/admin-api/notifications.ts tests/notification-center-contract.test.ts
          git commit -m 'style(admin): verify notification center slice'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
