name: fix-pr-90-types

on:
  push:
    branches:
      - feat/adm-mkt-006-content-calendar-scheduling

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adm-mkt-006-content-calendar-scheduling
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded type fixes
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(path, oldText, newText) {
            let text = fs.readFileSync(path, 'utf8');
            if (text.includes(newText)) return false;
            if (!text.includes(oldText)) throw new Error(`Expected source not found in ${path}`);
            text = text.replace(oldText, newText);
            fs.writeFileSync(path, text);
            return true;
          }

          replaceOnce(
            'app/marketing/campaigns/[campaignId]/page.tsx',
            'const publishLabels: Record<CampaignPublishStatus, string> = {\n  Queued: "در صف",',
            'const publishLabels: Record<CampaignPublishStatus, string> = {\n  Scheduled: "زمان‌بندی‌شده",\n  Queued: "در صف",'
          );
          replaceOnce(
            'app/marketing/campaigns/[campaignId]/page.tsx',
            '  OutcomeUnknown: "نتیجه نامشخص",\n};',
            '  OutcomeUnknown: "نتیجه نامشخص",\n  Cancelled: "لغوشده",\n};'
          );
          replaceOnce(
            'app/marketing/content-calendar/page.tsx',
            '      {groups.map((group) => {\n        const first = new Date(executionInstant(group.items[0]));',
            '      {groups.map((group) => {\n        const firstItem = group.items[0];\n        if (!firstItem) return null;\n        const first = new Date(executionInstant(firstItem));'
          );
          NODE
      - run: npm install --no-audit --no-fund
      - run: npm run format
      - run: npm run typecheck
      - name: Commit fixes if needed
        run: |
          if git diff --quiet; then
            echo "No type fixes pending."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/marketing/campaigns/'[campaignId]'/page.tsx app/marketing/content-calendar/page.tsx
          git commit -m "fix(marketing): satisfy scheduled publishing types"
          git push origin HEAD:feat/adm-mkt-006-content-calendar-scheduling
