name: tmp-adm-plat-002-format

on:
  pull_request:
    paths:
      - 'src/components/shell/**'
      - 'src/lib/admin-api/global-search.ts'
      - 'app/api/admin/search/route.ts'
      - 'tests/global-command-palette-contract.test.ts'
      - '.github/workflows/tmp-adm-plat-002-format.yml'

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Apply repository Prettier and remove helper
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run format
          git rm .github/workflows/tmp-adm-plat-002-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app src tests
          git commit -m 'style(admin): apply command palette formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
