name: admin-preview-staging

on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".env.example"
      - ".github/workflows/preview-staging.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Artifact build target (never deploys)"
        required: true
        default: staging
        type: choice
        options:
          - preview
          - staging

permissions:
  contents: read

concurrency:
  group: admin-preview-staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DELIVERY_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || inputs.target }}
  NEXT_PUBLIC_SUPABASE_URL: https://delivery-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: delivery_publishable_placeholder
  NEXT_PUBLIC_ADMIN_API_URL: https://admin-api.delivery-placeholder.test

jobs:
  build-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate delivery boundary
        run: npm run delivery:check

      - name: Verify browser secret boundary
        run: npm run security:check

      - name: Build QA artifact
        run: npm run build

      - name: Upload QA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-${{ env.DELIVERY_TARGET }}-${{ github.sha }}
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
