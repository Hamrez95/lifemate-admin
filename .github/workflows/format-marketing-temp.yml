name: format-marketing-temp

on:
  push:
    branches:
      - feat/marketing-references-12-13-23

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/marketing-references-12-13-23
          persist-credentials: true
          show-progress: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Format marketing sources
        run: >-
          npx prettier --write
          app/marketing/campaigns/campaigns.module.css
          app/marketing/campaigns/page.tsx
          app/marketing/content-calendar/calendar.module.css
          app/marketing/content-studio/studio.module.css
          tests/marketing-reference-pages-contract.test.ts
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-marketing-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(marketing): apply repo formatting"
          git push origin HEAD:feat/marketing-references-12-13-23
