name: format-pr-90

on:
  push:
    branches:
      - feat/adm-mkt-006-content-calendar-scheduling

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adm-mkt-006-content-calendar-scheduling
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Apply repository formatting
        run: npm run format
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(marketing): format ADM-MKT-006"
          git push origin HEAD:feat/adm-mkt-006-content-calendar-scheduling
