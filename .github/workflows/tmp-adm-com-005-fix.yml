name: tmp-adm-com-005-fix

on:
  pull_request:
    paths:
      - 'src/lib/admin-api/commerce-promotions.ts'
      - '.github/workflows/tmp-adm-com-005-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Repair promotion client and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/admin-api/commerce-promotions.ts')
          text = path.read_text()

          projection_old = '''  const {\n    primaryCodeMasked: _masked,\n    primaryCodeStatus: _status,\n    primaryCodeMaxRedemptions: _limit,\n    codeCount: _count,\n    ...detailPromotion\n  } = row;'''
          projection_new = '''  const detailPromotion: CommercePromotionDetail["promotion"] = {\n    promotionId: row.promotionId,\n    name: row.name,\n    description: row.description,\n    product: row.product,\n    discount: row.discount,\n    storedStatus: row.storedStatus,\n    effectiveStatus: row.effectiveStatus,\n    startsAtUtc: row.startsAtUtc,\n    endsAtUtc: row.endsAtUtc,\n    maxRedemptions: row.maxRedemptions,\n    redemptionSummary: row.redemptionSummary,\n    createdAtUtc: row.createdAtUtc,\n    updatedAtUtc: row.updatedAtUtc,\n  };'''
          if projection_old not in text:
              raise SystemExit('expected projection block not found')
          text = text.replace(projection_old, projection_new)

          guard = '  if (!isRecord(value.summary) || !isRecord(value.filters) || !isRecord(value.source)) return null;\n'
          if guard not in text:
              raise SystemExit('expected summary guard not found')
          text = text.replace(guard, guard + '  const summary = value.summary;\n', 1)
          text = text.replace('value.summary[key]', 'summary[key]')
          text = text.replace('Number(value.summary.total)', 'Number(summary.total)')
          text = text.replace('Number(value.summary.draft)', 'Number(summary.draft)')
          text = text.replace('Number(value.summary.active)', 'Number(summary.active)')
          text = text.replace('Number(value.summary.paused)', 'Number(summary.paused)')
          text = text.replace('Number(value.summary.expired)', 'Number(summary.expired)')
          path.write_text(text)
          PY
          npm install --no-audit --no-fund
          npm run format
          npm run lint
          npm run typecheck
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/admin-api/commerce-promotions.ts
          git commit -m 'fix(commerce): validate promotion client types'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
