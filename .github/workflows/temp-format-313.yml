name: temp-format-313

on:
  push:
    branches:
      - fix/313-prettier

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted-313]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Format analytics contract only
        run: >-
          npx prettier --write
          src/lib/admin-api/marketing-creative-analytics-contract.ts
          src/lib/admin-api/marketing-creative-analytics-contract.test.ts
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/admin-api/marketing-creative-analytics-contract.ts src/lib/admin-api/marketing-creative-analytics-contract.test.ts
          git commit -m "chore(marketing): format analytics contract [formatted-313]"
          git push origin HEAD:fix/313-prettier
