name: format-admin-mkt-002

on:
  push:
    branches:
      - feat/adm-mkt-002-campaign-workflow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: feat/adm-mkt-002-campaign-workflow
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply repository formatter and remove helper
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          rm .github/workflows/format-admin-mkt-002.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(marketing): apply repository formatting"
          git push origin HEAD:feat/adm-mkt-002-campaign-workflow
