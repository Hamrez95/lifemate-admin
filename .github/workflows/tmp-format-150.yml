name: tmp-format-150

on:
  push:
    branches:
      - feat/150-access-grant-actions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/150-access-grant-actions
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/relationships src/lib/admin-api/relationship-access-grant-actions.ts tests/relationship-access-grant-control-contract.test.ts
          git commit -m "style(relationships): apply repository formatter (#150)"
          git push origin HEAD:feat/150-access-grant-actions
