name: format-support-temp

on:
  pull_request:
    paths:
      - "app/support/**"
      - "tests/support-reference-pages-contract.test.ts"
      - ".github/workflows/format-support-temp.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          show-progress: false
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: support-formatted
          path: |
            app/support/**
            tests/support-reference-pages-contract.test.ts
          if-no-files-found: error
          retention-days: 1
