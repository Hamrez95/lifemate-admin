name: admin-web-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: admin-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply canonical formatting on task branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: apply canonical prettier formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          git diff --exit-code

      - name: Browser secret boundary
        run: npm run security:check

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci_publishable_placeholder
          NEXT_PUBLIC_ADMIN_API_URL: https://admin-api.ci-placeholder.test
        run: npm run build
