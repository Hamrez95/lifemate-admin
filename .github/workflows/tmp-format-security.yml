name: tmp-format-security
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/security-references-18-20
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write app/security/audit/audit.module.css app/security/security-layout.module.css 'app/security/roles/[roleCode]/staff-membership-controls.module.css' tests/security-reference-pages-contract.test.ts
      - run: |
          rm .github/workflows/tmp-format-security.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/security tests/security-reference-pages-contract.test.ts .github/workflows/tmp-format-security.yml
          git commit -m 'style(security): apply repo formatting'
          git push origin HEAD:feat/security-references-18-20
